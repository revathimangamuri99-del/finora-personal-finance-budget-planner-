<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Finora</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page login-page">
  <main class="login-layout">
    <section class="login-art-panel">
      <div class="login-art-copy">
        <h1>Keep track of your money<br>and save for <span>your future.</span></h1>
        <p>Finora helps you track expenses, plan budgets,<br class="desktop-break"> and build your savings with confidence.</p>
      </div>
      <div class="login-art-wrap">
        <img src="login-illustration.jpeg" alt="Illustration of a person tracking finances with savings, coins and charts">
      </div>
    </section>

    <section class="login-form-panel">
      <div class="login-form-inner">
        <a class="brand" href="index.html" aria-label="Finora home"><span class="brand-mark" aria-hidden="true">▰</span><span>Finora</span></a>
        <span class="eyebrow">WELCOME BACK</span>
        <h2>Login</h2>
        <p class="intro">Welcome back! Enter your details to continue.</p>
        <form id="loginForm" class="auth-form" novalidate>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
            <button type="button" class="eye-button" data-target="password" aria-label="Show password">◉</button>
          </div>
          <div class="forgot-row">
    <a href="/forgot-password.html">Forgot Password?</a>
</div>
          <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Login <span aria-hidden="true">→</span></button>
        </form>
        <div class="or-divider"><span>OR</span></div>
        <p class="switch-line">Don’t have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
